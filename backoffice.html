<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>backoffice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Backoffice</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Saldi</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main id="main-container" class="container my-5 bg-light">
      <h1 class="mb-4 text-center">ADD and Dealete new stuff</h1>

      <form id="product-form" class="bg-white p-4 rounded shadow-sm">
        <div class="mb-3">
          <label for="name" class="form-label">Nome</label>
          <input type="text" id="name" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Descrizione</label>
          <textarea id="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
          <label for="brand" class="form-label">Marchio</label>
          <input type="text" id="brand" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="imgUrl" class="form-label">URL Immagine</label>
          <input type="url" id="imageUrl" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="price" class="form-label">Prezzo (€)</label>
          <input type="number" id="price" class="form-control" required />
        </div>
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success"><i class="fas fa-save">Salva</i></button>
          <button type="button" id="delete-btn" class="btn btn-danger"><i class="fas fa-trash-alt">Elimina</i></button>
        </div>
      </form>
      <h2 class="mt-5 text-center">Tutti prodotti</h2>
      <div id="products-list" class="row mt-4"></div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script src="./backoffice.js"></script>
  </body>
</html>
